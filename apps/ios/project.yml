# Xcode-Projekt wird erzeugt mit: brew install xcodegen && xcodegen generate
name: Nova
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator erreicht den Mac unter localhost. Für Geräte/Produktion überschreiben.
    NOVA_BACKEND_URL: "http://localhost:8080"
targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - Nova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nova
        INFOPLIST_FILE: Nova/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nova/Nova.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Kotlin Multiplatform (Shared.framework)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
