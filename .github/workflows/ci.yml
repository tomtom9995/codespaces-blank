name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ktor) – Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test buildFatJar --no-daemon
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/nova-backend.jar

  mobile:
    name: Shared + Android – Build, Tests, UI-Durchlauf
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nova" --health-interval 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: backend-jar, path: backend-jar }
      - name: Backend für den End-to-End-Test starten
        run: |
          DEV_MODE=true ONBOARDING_EMAILS=false java -jar backend-jar/nova-backend.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/health && exit 0; sleep 2; done
          cat backend.log; exit 1
      - name: Build und Tests (inkl. Klick-Durchlauf mit Screenshots)
        env:
          NOVA_BACKEND_URL: http://localhost:8080
          MAILPIT_URL: http://localhost:8025
        run: ./gradlew :shared:jvmTest :apps:android:assembleDebug :apps:android:recordRoborazziDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: docs/screenshots/android/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/build/test-results/
            apps/android/build/reports/tests/
            backend.log

  ios:
    name: iOS – Build (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild -project Nova.xcodeproj -scheme Nova -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

  cms:
    name: Strapi – Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cms/strapi/package-lock.json }
      - run: node cms/scripts/validate-content.mjs
      - run: npm ci && npm run build
        working-directory: cms/strapi

  infra:
    name: Hosting & Backup – Prüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell-Skripte (shellcheck)
        run: shellcheck -S warning infra/backup/*.sh infra/hosting/*.sh infra/hosting/nextcloud/*.sh infra/hosting/keycloak/*.sh infra/hosting/nextcloud/hooks/*/*.sh infra/hosting/wordpress/*.sh
      - name: Migrationsskript (Konten alte Nextcloud → Keycloak)
        run: python3 -m unittest discover -s infra/migration -p 'test_*.py'
      - name: Keycloak-Realm ist gültiges JSON
        run: jq empty infra/hosting/keycloak/realm-chattia.json
      - name: Compose-Datei
        working-directory: infra/hosting
        run: cp .env.example .env && docker compose config --quiet
      - name: Backup-Image bauen
        run: docker build -t chattia-backup infra/backup
      - name: Backup-Image – Werkzeuge vorhanden
        run: docker run --rm --entrypoint sh chattia-backup -c 'restic version && pg_dump --version && mariadb-dump --version && age --version && zstd --version'
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform (Backup-Projekt)
        working-directory: infra/terraform/backup
        run: terraform fmt -check && terraform init -backend=false -input=false && terraform validate
      - name: Terraform (Hosting-VM)
        working-directory: infra/terraform/hosting
        run: terraform fmt -check && terraform init -backend=false -input=false && terraform validate
